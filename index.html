<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>我的待办清单</title>
<style>
:root{--accent:#6c63ff;--ink:#23233b;--muted:#8b8ca5;--paper:rgba(255,255,255,.9)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(130deg,#f0edff,#f9fbff 50%,#dff7f2);display:grid;place-items:center;padding:28px 16px}.app{width:min(100%,680px);background:var(--paper);border:1px solid rgba(255,255,255,.75);box-shadow:0 24px 60px rgba(76,72,142,.18);border-radius:28px;padding:32px;backdrop-filter:blur(14px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}h1{margin:0;font-size:clamp(1.65rem,4vw,2.25rem);letter-spacing:-.05em}.date{margin-top:7px;color:var(--muted);font-size:.92rem}.badge{background:#eeedff;color:var(--accent);padding:8px 12px;border-radius:999px;font-size:.82rem;font-weight:700;white-space:nowrap}form{display:flex;gap:10px;margin-bottom:20px}input{min-width:0;flex:1;border:1.5px solid #e6e5f0;padding:14px 15px;outline:0;border-radius:14px;font:inherit;color:var(--ink);background:#fff;transition:.2s}input:focus{border-color:var(--accent);box-shadow:0 0 0 4px #6c63ff18}button{font:inherit;border:0;cursor:pointer}.add{color:#fff;background:var(--accent);padding:0 19px;border-radius:14px;font-weight:700}.add:hover{transform:translateY(-1px);background:#5951ed}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #ecebf3;padding-bottom:14px;margin-bottom:7px}.filters{display:flex;gap:5px}.filter{padding:7px 9px;background:transparent;color:var(--muted);border-radius:9px;font-size:.86rem}.filter.active{color:var(--accent);background:#eeedff;font-weight:700}.clear{color:var(--muted);background:transparent;font-size:.84rem;padding:7px 0}.clear:hover{color:#ef5670}ul{padding:0;margin:0;list-style:none}li{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid #f0eff5;animation:enter .22s ease}@keyframes enter{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}.check{appearance:none;width:22px;height:22px;margin:0;border:2px solid #d5d3e5;border-radius:8px;cursor:pointer;flex:0 0 auto}.check:checked{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px #fff}.task{flex:1;line-height:1.4;word-break:break-word}li.done .task{color:#9b9bad;text-decoration:line-through}.delete{opacity:0;color:#a3a2b1;background:transparent;font-size:1.25rem;padding:4px 7px;border-radius:8px}li:hover .delete,.delete:focus{opacity:1}.delete:hover{color:#ef5670;background:#fff0f3}.empty{padding:38px 10px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:space-between;color:var(--muted);font-size:.83rem;padding-top:17px}@media(max-width:480px){.app{padding:24px 18px;border-radius:22px}header{align-items:flex-start}.controls{align-items:flex-start;flex-direction:column}.delete{opacity:1}}
</style></head>
<body><main class="app"><header><div><h1>我的待办清单</h1><div class="date" id="date"></div></div><span class="badge" id="progress">0 项待完成</span></header><form id="task-form"><input id="task-input" autocomplete="off" maxlength="160" placeholder="写下你想完成的事…" aria-label="新的待办事项" required><button class="add" type="submit">添加</button></form><div class="controls"><div class="filters" role="group" aria-label="筛选待办"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="active">待完成</button><button class="filter" data-filter="done">已完成</button></div><button class="clear" id="clear-completed">清除已完成</button></div><ul id="task-list" aria-live="polite"></ul><div class="empty" id="empty">还没有待办事项，先写下今天的小目标吧。</div><footer><span id="count">0 项待完成</span><span>数据已保存在本机</span></footer></main>
<script>
const key='simple-todo-list-v1',list=document.querySelector('#task-list'),empty=document.querySelector('#empty'),input=document.querySelector('#task-input'),form=document.querySelector('#task-form');let tasks=JSON.parse(localStorage.getItem(key)||'[]'),filter='all';document.querySelector('#date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());
function save(){localStorage.setItem(key,JSON.stringify(tasks))}function render(){const shown=tasks.filter(t=>filter==='all'||(filter==='active'?!t.done:t.done));list.innerHTML='';shown.forEach(task=>{const li=document.createElement('li');li.className=task.done?'done':'';const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=task.done;check.setAttribute('aria-label','标记完成');check.onchange=()=>{task.done=check.checked;save();render()};const label=document.createElement('span');label.className='task';label.textContent=task.text;const del=document.createElement('button');del.className='delete';del.innerHTML='&times;';del.title='删除';del.setAttribute('aria-label','删除事项');del.onclick=()=>{tasks=tasks.filter(t=>t.id!==task.id);save();render()};li.append(check,label,del);list.append(li)});empty.hidden=shown.length>0;const active=tasks.filter(t=>!t.done).length,word=active+' 项待完成';document.querySelector('#count').textContent=word;document.querySelector('#progress').textContent=word}
form.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;tasks.unshift({id:Date.now(),text,done:false});save();input.value='';filter='all';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));render();input.focus()};document.querySelectorAll('.filter').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===button));render()});document.querySelector('#clear-completed').onclick=()=>{tasks=tasks.filter(t=>!t.done);save();render()};render();
</script></body></html>
